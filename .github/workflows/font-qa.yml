name: Font and website QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  font-and-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/font/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r tools/font/requirements.txt
      - run: npm test
      - run: python tools/font/verify_supplement_font.py
      - run: python tools/font/verify_german_ipa.py
      - name: Verify reproducible release artifacts
        run: |
          python tools/font/build_supplement_font.py
          git diff --exit-code -- assets/fonts/quanfangwei-supplement
