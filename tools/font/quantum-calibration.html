<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>荃方位補寫體 · 量子物理校準 1.033</title>
<style>
@font-face{font-family:QuantumProof;src:url('../../assets/fonts/quanfangwei-supplement/QuanFangweiSupplementScript-Regular.woff2?v=1.033') format('woff2');font-display:block}
*{box-sizing:border-box}body{background:#f8f5ee;color:#182d38;margin:32px auto;padding:0 28px;max-width:1300px;font:16px system-ui}h1{font-size:28px}p{line-height:1.6}header{border-bottom:1px solid #c7c7bf;margin-bottom:24px;padding-bottom:18px}label{display:block;margin:24px 0}input{vertical-align:middle}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.cell{background:#fffdf8;border:1px solid #ded9ce;text-align:center;padding:16px 4px}.symbol{font:100px QuantumProof;line-height:1.4}.code{font:12px monospace;color:#55666e}.sample{font-family:QuantumProof;font-size:var(--size,40px);line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;background:repeating-linear-gradient(transparent,transparent calc(1.8em - 1px),#d9e0df calc(1.8em - 1px),#d9e0df 1.8em);padding:0 12px}section{margin:32px 0}.status{color:#326147}button{font:inherit;padding:5px 12px}#proof[hidden]{display:none}
</style>
<header><h1>荃方位補寫體 · 量子物理校準</h1><p>Version 1.033 · P0 5 字 / P1 14 字 / P2 13 字 / P3 13 字<br>每個符號有獨立 Unicode mapping。P2／P3 為預備需求，並不代表已逐頁確認所有講義。</p><div id="status" class="status">載入原生 WOFF2 字型中…</div></header>
<main id="proof" hidden><div id="grid" class="grid"></div><label>混排字級 <input id="size" type="range" min="16" max="80" value="40"> <output id="value">40 px</output></label><section id="samples"></section><p>分數、帽號與向量箭頭的完整數學排版不屬於本校準頁；U+20D7 未新增。16／24／40／64 px 無 fallback PNG 與完整 audit 可於 repo 對照。</p></main>
<script>
const groups={P0:'ℏ∂∝−↔',P1:'∑∇⋅⟨⟩≈≃∼≤≥≪≫⇒⇔',P2:'∏∓†″ℓ⊗‖∬∭ϵϕ≲≳',P3:'∀∃∈∉ℝℂℋℒℱℜℑϑϱ'};
const samples=['E = ℏω     p = ℏk     ΔxΔp ≥ ℏ/2','iℏ ∂ψ/∂t = Hψ     ∂²ψ/∂x²     ∂ρ/∂t','ψ(r,t) ∝ e^(i(k⋅r−ωt))','⟨x⟩     ⟨p⟩     ⟨ψ|H|ψ⟩     ∇ψ     ∇⋅J','∑ a₁     ∏ ψ₁     A ⇒ B     A ⇔ B     energy ↔ frequency','a ≈ b     a ≃ b     a ∼ b     x ≤ y     x ≥ y','x ≪ 1     E ≫ kT     a ≲ b     a ≳ b','A†A     ψ″(x)     ℓ = 1     A ⊗ B     ‖ψ‖ = 1','∬ f dxdy     ∭ ρ dxdydz     x = ±a     y = ∓b','∀x ∈ ℝ     ∃z ∈ ℂ     x ∉ A     ψ ∈ ℋ','ℒψ     ℱ(f)     ℜ(z)     ℑ(z)','h / ℏ     ∂ / δ / d     l / ℓ / 1 / I     ν / v','Σ / ∑     Π / ∏     · / ⋅     〈x〉 / ⟨x⟩     ∥ / ‖','ε / ϵ     φ / ϕ     θ / ϑ     ρ / ϱ','R / ℝ / ℜ     C / ℂ     H / ℋ     L / ℒ     F / ℱ     I / ℑ'];
(async()=>{try{const audit=await fetch('../../analysis/font-coverage.json').then(r=>{if(!r.ok)throw Error('audit unavailable');return r.json()});if(audit.present_count!==45||audit.failures.length)throw Error('coverage audit failed');const faces=await document.fonts.load('40px QuantumProof',Object.values(groups).join(''));if(!faces.length||!faces.every(f=>f.status==='loaded'))throw Error('font load failed');for(const [group,chars]of Object.entries(groups))for(const c of chars){const cell=document.createElement('div');cell.className='cell';const glyph=document.createElement('div');glyph.className='symbol';glyph.textContent=c;const code=document.createElement('div');code.className='code';code.textContent=group+' U+'+c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0');cell.append(glyph,code);document.getElementById('grid').append(cell)}for(const s of samples){const p=document.createElement('div');p.className='sample';p.textContent=s;document.getElementById('samples').append(p)}document.getElementById('status').textContent='WOFF2 已載入 · cmap audit 45/45 · 無缺字符號';document.getElementById('proof').hidden=false}catch(e){document.getElementById('status').textContent='校準載入失敗：'+e.message}})();
document.getElementById('size').oninput=e=>{document.documentElement.style.setProperty('--size',e.target.value+'px');document.getElementById('value').textContent=e.target.value+' px'};
</script>
</html>
