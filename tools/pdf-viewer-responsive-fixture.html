<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive PDF Viewer Toolbar QA</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #d7dce4; }
    body { display: grid; place-items: start center; padding: 12px; }
    iframe { display: block; border: 2px solid #293446; background: white; }
  </style>
</head>
<body>
  <iframe id="responsiveFixture" title="Responsive PDF viewer fixture"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const width = Math.min(1200, Math.max(320, Number(params.get("width")) || 390));
    const height = Math.min(1400, Math.max(480, Number(params.get("height")) || 844));
    const frame = document.querySelector("#responsiveFixture");
    frame.width = String(width);
    frame.height = String(height);
    frame.src = "./pdf-viewer-fixture.html";
  </script>
</body>
</html>
