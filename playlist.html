<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="查看與播放私人歌曲播放清單">
  <title>播放清單｜歌曲歌詞 PDF 資料庫</title>
  <link rel="icon" type="image/png" sizes="256x256" href="./assets/branding/favicon.png">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <header class="site-header"><div class="header-inner"><a class="brand" href="./"><span class="brand-logo" aria-hidden="true"><img src="./assets/branding/logo-retro.png" width="1024" height="1024" alt=""></span><span><strong>歌曲歌詞 PDF 資料庫</strong><small>播放清單</small></span></a><div class="compact-actions"><a class="button secondary" href="./playlists.html">我的播放清單</a><a class="button secondary" href="./">歌曲資料庫</a></div></div></header>
  <main class="page playlist-detail-page">
    <section id="playlistDetailMessage" class="notice hidden" role="status" aria-live="polite"></section>
    <section id="playlistDetailLoading" class="state-panel"><div class="spinner"></div><p>載入播放清單中…</p></section>
    <section id="playlistDetail" class="playlist-detail hidden">
      <header class="playlist-detail-header"><div><p class="eyebrow">Private playlist</p><h1 id="playlistDetailName"></h1><p id="playlistDetailDescription" class="muted"></p><p id="playlistDetailCount" class="playlist-count"></p></div><button id="playPlaylistButton" class="button primary" type="button">播放清單</button></header>
      <div id="playlistItemList" class="playlist-item-list" aria-live="polite"></div>
      <section id="playlistDetailEmpty" class="state-panel hidden"><h2>這個播放清單還沒有歌曲</h2><a class="button primary" href="./">返回歌曲資料庫</a></section>
    </section>
  </main>
  <script type="module" src="./assets/playlist-page.js"></script>
</body>
</html>
